version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file: .env

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  agent:
    build: .
    command: python -m scheduler.main_pipeline
    env_file: .env
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: celery -A scheduler.worker worker --concurrency=8 --loglevel=info
    env_file: .env
    depends_on:
      - postgres
      - redis

  dashboard:
    build: .
    command: uvicorn dashboard.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - postgres

volumes:
  pgdata:
